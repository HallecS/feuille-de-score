<title>Feuille de score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E6A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne étroite façon carnet de score, un tapis vert pour les actions, une pastille de couleur par joueur */
:root {
  --bg: #F2F4F0;
  --surface: #FFFFFF;
  --ink: #18231D;
  --muted: #5B6A61;
  --line: #D9E1DB;
  --felt: #1E6A4C;
  --felt-ink: #FFFFFF;
  --gold: #B97D0C;
  --danger: #B4372B;
  --p0: #D2453A; --p1: #2F6FD0; --p2: #D19A12; --p3: #2E9B5E;
  --p4: #8A4FC9; --p5: #E07A22; --p6: #1D9AA6; --p7: #D34C8C;
  /* Couleurs des lignes du carnet 7 Wonders */
  --c-mil: #C63A2F; --c-coins: #A57A3C; --c-wonder: #85806F; --c-civil: #2D66C4;
  --c-commerce: #D9A514; --c-guild: #7D4BB8; --c-sci: #2E8B57;
  --c-leaders: #A39C8C; --c-cities: #3A3A3A; --c-debt: #8C4A3A; --c-naval: #1F7FA8; --c-islands: #2F9C95; --c-edifice: #9C6B3A;
  --c-progress: #4F9A2F; --c-pantheon: #B8862B; --c-agora: #A0463C;
  --c-houses: #3F6FC4; --c-markets: #D9A514; --c-barracks: #C63A2F; --c-temples: #7D4BB8; --c-gardens: #2E8B57; --c-stones: #7F8790;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #18211C; --ink: #E8EEE9; --muted: #98A69D; --line: #2B3730;
    --felt: #3FA37A; --felt-ink: #06120C; --gold: #E6AE40; --danger: #E36D60;
    --c-mil: #E2584C; --c-coins: #C99A55; --c-wonder: #A9A491; --c-civil: #5B8FE6;
    --c-commerce: #E8B930; --c-guild: #A178D8; --c-sci: #4DB57C;
    --c-leaders: #DCD6C8; --c-cities: #9A9A9A; --c-debt: #C47A66; --c-naval: #4AAED8; --c-islands: #52C2BA; --c-edifice: #C9945C;
    --c-progress: #79C255; --c-pantheon: #E0B04F; --c-agora: #D6766A;
    --c-houses: #5B8FE6; --c-markets: #E8B930; --c-barracks: #E2584C; --c-temples: #A178D8; --c-gardens: #4DB57C; --c-stones: #A3ABB5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #18211C; --ink: #E8EEE9; --muted: #98A69D; --line: #2B3730;
  --felt: #3FA37A; --felt-ink: #06120C; --gold: #E6AE40; --danger: #E36D60;
  --c-mil: #E2584C; --c-coins: #C99A55; --c-wonder: #A9A491; --c-civil: #5B8FE6;
  --c-commerce: #E8B930; --c-guild: #A178D8; --c-sci: #4DB57C;
  --c-leaders: #DCD6C8; --c-cities: #9A9A9A; --c-debt: #C47A66; --c-naval: #4AAED8; --c-islands: #52C2BA; --c-edifice: #C9945C;
  --c-progress: #79C255; --c-pantheon: #E0B04F; --c-agora: #D6766A;
  --c-houses: #5B8FE6; --c-markets: #E8B930; --c-barracks: #E2584C; --c-temples: #A178D8; --c-gardens: #4DB57C; --c-stones: #A3ABB5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--felt); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
.head { min-width: 0; display: flex; flex-direction: column; }
.head small { font-size: 0.78rem; font-weight: 500; color: var(--muted); }
.mode-wrap { position: relative; display: inline-flex; align-items: center; align-self: flex-start; max-width: 100%; }
.mode-wrap select {
  appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: var(--ink);
  font: 800 clamp(1.1rem, 4.8vw, 1.45rem) var(--font-display); letter-spacing: -0.01em; padding: 0 26px 0 0; max-width: 100%;
  cursor: pointer; text-overflow: ellipsis;
}
.mode-wrap select option {
  background: var(--surface); color: var(--ink);
  font: 600 1rem var(--font-body); letter-spacing: 0;
}
.mode-wrap::after {
  content: ""; position: absolute; right: 5px; top: 50%; width: 8px; height: 8px;
  border-right: 2.5px solid var(--felt); border-bottom: 2.5px solid var(--felt);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-size: 1.1rem; font-weight: 600; }

.ghost {
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: 0.9rem; white-space: nowrap;
}
.ghost:hover { border-color: var(--muted); }

.banner {
  background: color-mix(in srgb, var(--gold) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  border-radius: 12px; padding: 10px 14px; font-size: 0.9rem;
}

.label {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}

/* Joueurs */
.players { display: flex; flex-direction: column; gap: 8px; }
.player {
  display: grid; grid-template-columns: 6px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 10px 10px 0; overflow: hidden;
}
.player .stripe { align-self: stretch; }
.player .who { min-width: 0; }
.player .name { font-weight: 700; overflow-wrap: anywhere; }
.player .rank { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.player.lead .rank { color: var(--gold); font-weight: 700; }
.player.wide { grid-template-columns: 6px minmax(0, 1fr) auto; row-gap: 8px; }
.player.wide .stripe { grid-row: span 2; }
.total {
  font-family: var(--font-display); font-weight: 800; font-size: 1.7rem;
  font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: right; line-height: 1;
}
.entry { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.entry:focus-within { border-color: var(--felt); }
.sign {
  width: 38px; height: 44px; border: 0; border-right: 1.5px solid var(--line);
  background: transparent; font-weight: 700; font-size: 1.05rem; color: var(--muted);
}
.sign.neg { color: var(--danger); }
.entry input {
  width: 64px; height: 44px; border: 0; background: transparent; color: var(--ink);
  font: 600 1.15rem var(--font-body); text-align: center; font-variant-numeric: tabular-nums;
}
.entry input:focus { outline: none; }
.entry input::placeholder { color: var(--muted); opacity: 0.6; }

.sci { grid-column: 2 / -1; display: flex; gap: 8px; }
.sym { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; font-weight: 600; color: var(--muted); }
.sym .entry input { width: 100%; }

.actions { display: flex; flex-direction: column; gap: 8px; }
.primary {
  background: var(--felt); color: var(--felt-ink); border: 0; border-radius: 14px;
  padding: 15px 18px; font-weight: 700; font-size: 1.05rem; width: 100%;
}
.primary:active { transform: translateY(1px); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; }
.msg { min-height: 1.3em; font-size: 0.88rem; color: var(--danger); margin: 0; text-align: center; }

/* Catégories 7 Wonders */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-weight: 600; font-size: 0.88rem;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.exts { display: flex; flex-direction: column; gap: 8px; }
.ext-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ext {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1.5px dashed var(--line); background: transparent; border-radius: 8px;
  padding: 6px 11px; font-weight: 600; font-size: 0.85rem; color: var(--muted);
}
.ext b {
  width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid currentColor;
  display: inline-grid; place-items: center; font-size: 0.7rem; line-height: 1;
}
.ext.on { border-style: solid; border-color: var(--felt); color: var(--ink); background: color-mix(in srgb, var(--felt) 12%, var(--surface)); }
.ext.on b { background: var(--felt); border-color: var(--felt); color: var(--felt-ink); }
.name-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.mods { display: flex; flex-wrap: wrap; gap: 4px; }
.mod {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.74rem; font-weight: 600; line-height: 1.2;
  border: 1.5px dashed var(--line); border-radius: 999px; padding: 4px 9px;
  background: transparent; color: var(--muted);
}
.mod b { font-weight: 800; }
.mod.on { border-style: solid; border-color: var(--c); color: var(--ink); background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.cat-hint { margin: 0; font-size: 0.9rem; color: var(--muted); border-left: 3px solid var(--c); padding-left: 10px; }

.ranking { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ranking li {
  display: grid; grid-template-columns: 3.2ch 10px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
}
.ranking .pos { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.ranking li.first .pos { color: var(--gold); }
.ranking .dot { width: 10px; height: 10px; border-radius: 50%; }
.ranking .nm { font-weight: 600; overflow-wrap: anywhere; }
.ranking .nm small { display: block; font-weight: 500; font-size: 0.78rem; color: var(--muted); }
.ranking .pts { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }

/* Historique */
.history { display: flex; flex-direction: column; gap: 10px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; color: var(--muted); position: sticky; left: 0; background: var(--surface); }
thead th { font-size: 0.8rem; font-weight: 700; }
thead th span, td:first-child span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
tbody tr[data-round] { cursor: pointer; }
tbody tr[data-round]:hover td { background: color-mix(in srgb, var(--felt) 6%, var(--surface)); }
tbody tr.editing td { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
tfoot td { font-weight: 800; border-bottom: 0; }
td.neg { color: var(--danger); }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
.danger-link { background: none; border: 0; color: var(--danger); font-weight: 600; font-size: 0.9rem; padding: 6px 0; align-self: flex-start; }

/* Parties enregistrées */
.footer { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--felt); font-weight: 700; font-size: 0.95rem; text-decoration: underline; text-underline-offset: 3px; }
.notice { margin: 0; font-size: 0.88rem; font-weight: 600; color: var(--felt); min-height: 1.2em; }
.archive { display: flex; flex-direction: column; gap: 10px; }
.game-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.game-head { width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.g-top { display: flex; justify-content: space-between; gap: 10px; font-size: 0.74rem; }
.g-mode { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--felt); }
.g-date { color: var(--muted); font-variant-numeric: tabular-nums; }
.g-win { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
.g-win i { font-style: normal; color: var(--gold); }
.g-pts { color: var(--muted); font-weight: 600; font-size: 0.85em; }
.g-rest .g-pts { font-size: 1em; font-weight: 500; }
.g-rest { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.game-detail { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); margin: 0; }

/* Nouvelle partie */
.field { display: flex; flex-direction: column; gap: 8px; }
.field input {
  height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  font: 600 1rem var(--font-body); padding: 0 12px; width: 100%;
}
.field input:focus { outline: none; border-color: var(--felt); }
.setup { display: flex; flex-direction: column; gap: 16px; }
.names { display: flex; flex-direction: column; gap: 8px; }
.name-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.name-row .dot { width: 14px; height: 14px; border-radius: 50%; }
.name-row input {
  height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  font: 500 1rem var(--font-body); padding: 0 12px; width: 100%;
}
.name-row input:focus { outline: none; border-color: var(--felt); }
.remove { height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 1.4rem; border-radius: 10px; }
.remove:disabled { opacity: 0.25; cursor: default; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-row input {
  flex: 1 1 160px; min-width: 0; height: 46px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: 500 1rem var(--font-body); padding: 0 12px;
}
.add-row input:focus { outline: none; border-color: var(--felt); }
.add-row .ok { background: var(--felt); color: var(--felt-ink); border: 0; border-radius: 10px; padding: 0 16px; height: 46px; font-weight: 700; }
.add-row .ghost { height: 46px; }
.add-btn { align-self: flex-start; }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
}
.toggle input { width: 22px; height: 22px; accent-color: var(--felt); flex: none; }
.toggle:has(input:checked) { border-color: var(--felt); background: color-mix(in srgb, var(--felt) 10%, var(--surface)); }
.choice { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.choice legend { padding: 0; margin-bottom: 8px; width: 100%; }
.toggle small { display: block; color: var(--muted); font-size: 0.82rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
const KEY = "feuille-de-score.v1";
const MODES = {
  simple: { label: "Feuille de score", max: 8, min: 1 },
  sw: { label: "7 Wonders", max: 7, min: 2, setup: 3 },
  duel: { label: "7 Wonders Duel", max: 2, min: 2, setup: 2 },
  akropolis: { label: "Akropolis", max: 4, min: 2, setup: 2 },
};

const SYMS = [
  { key: "compass", label: "Compas" },
  { key: "gear", label: "Engrenage" },
  { key: "tablet", label: "Tablette" },
];

// Essaie toutes les répartitions des jokers et garde la meilleure
function sciPoints(sc) {
  const c = Math.max(0, parse(sc.compass) || 0), g = Math.max(0, parse(sc.gear) || 0), t = Math.max(0, parse(sc.tablet) || 0);
  const jokers = (hasMod(sc, "sciGuild") ? 1 : 0) + (hasMod(sc, "babylon") ? 1 : 0);
  const perSet = 7 + (hasMod(sc, "aristotle") ? 3 : 0);
  let best = 0;
  for (let a = 0; a <= jokers; a++) {
    for (let b = 0; a + b <= jokers; b++) {
      const x = c + a, y = g + b, z = t + (jokers - a - b);
      best = Math.max(best, x * x + y * y + z * z + perSet * Math.min(x, y, z));
    }
  }
  return best;
}
const num = v => parse(v) || 0;
const coinSets = sc => Math.floor(Math.max(0, num(sc.coins)) / 3);

// Les 5 types de quartiers d'Akropolis, avec leur règle de base et leur variante
const AKRO = [
  { key: "houses", label: "Habitations", plaza: "Habitation",
    rule: "Seul le plus grand groupe d'Habitations reliées compte.",
    variant: "si la valeur du groupe atteint 10 ou plus, ses points sont doublés (calcul automatique)." },
  { key: "markets", label: "Marchés", plaza: "Marché",
    rule: "Un Marché compte s'il ne touche aucun autre Marché.",
    variant: "un Marché adjacent à une place Marché compte double : indiquez la valeur de ces Marchés dans « Valeur doublée »." },
  { key: "barracks", label: "Casernes", plaza: "Caserne",
    rule: "Une Caserne compte si elle est en bordure de la cité.",
    variant: "une Caserne avec 3 ou 4 côtés vides compte double : indiquez leur valeur dans « Valeur doublée »." },
  { key: "temples", label: "Temples", plaza: "Temple",
    rule: "Un Temple compte s'il est entièrement entouré.",
    variant: "un Temple construit en hauteur compte double : indiquez leur valeur dans « Valeur doublée »." },
  { key: "gardens", label: "Jardins", plaza: "Jardin",
    rule: "Tous les Jardins comptent.",
    variant: "un Jardin adjacent à un lac compte double : indiquez leur valeur dans « Valeur doublée »." },
];

/*
 * Jeux à décompte par catégories. Chaque catégorie est une ligne du carnet :
 * `ext` = ligne ajoutée par une extension, `calc` = calcul spécial, `fields` = plusieurs cases à saisir.
 * `mods` = effets activables par joueur qui changent le calcul d'une catégorie.
 */
const TALLY = {
  sw: {
    exts: [
      { key: "leaders", label: "Leaders" },
      { key: "cities", label: "Cities" },
      { key: "armada", label: "Armada" },
      { key: "edifice", label: "Edifice" },
    ],
    cats: [
      { key: "mil", label: "Militaire", unit: "Points", signed: true, hint: "Somme des jetons Conflit, défaites (−1) comprises." },
      { key: "naval", label: "Naval", unit: "Points", signed: true, ext: "armada", hint: "Somme des jetons Conflit naval, défaites comprises." },
      { key: "coins", label: "Trésor", unit: "Pièces", hint: "Nombre de pièces en fin de partie : 1 point par lot de 3 pièces.",
        calc: sc => coinSets(sc) * (hasMod(sc, "midas") ? 2 : 1) },
      { key: "debt", label: "Dettes", unit: "Jetons", ext: "cities", hint: "Nombre de jetons Dette : −1 point chacun.",
        calc: sc => -Math.abs(num(sc.debt)) },
      { key: "wonder", label: "Merveille", unit: "Points", hint: "Points des étapes de merveille construites." },
      { key: "civil", label: "Civil", unit: "Points", hint: "Points des bâtiments civils (cartes bleues)." },
      { key: "commerce", label: "Commerce", unit: "Points", hint: "Points des bâtiments commerciaux (cartes jaunes)." },
      { key: "guild", label: "Guildes", unit: "Points", hint: "Points des guildes (cartes violettes)." },
      { key: "sci", label: "Science", unit: "Symboles", hint: "Nombre de symboles de chaque type. Chaque type rapporte son nombre au carré, plus 7 points par série complète. Les bonus à droite du nom s'activent d'un appui : chaque joker est placé automatiquement là où il rapporte le plus.",
        calc: sc => sciPoints(sc), fields: () => SYMS },
      { key: "leaders", label: "Leaders", unit: "Points", ext: "leaders", hint: "Points des leaders recrutés (cartes blanches)." },

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj.mode) {
      // Ancien format : une seule feuille de score simple
      const s = freshStore();
      if (obj.state) s.simple = { state: obj.state, draft: obj.draft || {}, editing: obj.editing ?? null };
      return s;
    }
    const s = freshStore();
    return { ...s, ...obj };
  } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}

/* ---------- Feuille de score simple ---------- */

function simpleTotals() {
  const s = current();
  const t = {};
  for (const p of s.players) t[p.id] = 0;
  for (const r of s.rounds) for (const p of s.players) t[p.id] += r[p.id] || 0;
  return t;
}
function simpleRanks(t) {
  const s = current();
  const vals = s.players.map(p => t[p.id]);
  const out = {};
  for (const p of s.players) out[p.id] = vals.filter(v => s.lowWins ? v < t[p.id] : v > t[p.id]).length + 1;
  return out;
}

function commitRound() {
  const sm = store.simple;
  const round = {};
  let filled = false;
  for (const p of sm.state.players) {
    const v = parse(sm.draft[p.id]);
    if (v !== null) filled = true;
    round[p.id] = v ?? 0;
  }
  if (!filled) { message = "Saisissez les points d'au moins un joueur."; return render(); }
  if (sm.editing !== null) sm.state.rounds[sm.editing] = round;
  else sm.state.rounds.push(round);
  sm.editing = null;
  sm.draft = {};
  message = "";
  confirmDelete = false;
  render();
}

function tallyPoints(pid) {
  const s = current();
  const sc = s.scores[pid] || {};
  const pts = {};
  const cats = activeCats();
  for (const cat of cats) pts[cat.key] = cat.calc ? cat.calc(sc, s) : num(sc[cat.key]);
  pts.total = cats.reduce((sum, cat) => sum + pts[cat.key], 0);
  pts.tie = G().tie.value(sc);
  return pts;
}
function tallyRanks() {
  const s = current();
  const all = s.players.map(p => ({ p, pts: tallyPoints(p.id) }));
  const instant = G().instant && s.instant && s.players.some(p => p.id === s.instant) ? s.instant : null;
  const better = (a, b) => {
    if (instant) {
      if (a.p.id === instant) return b.p.id !== instant;
      if (b.p.id === instant) return false;
    }
    return a.pts.total > b.pts.total || (a.pts.total === b.pts.total && a.pts.tie > b.pts.tie);
  };
  for (const x of all) {
    x.rank = all.filter(y => better(y, x)).length + 1;
    x.instant = x.p.id === instant;
    x.byTie = !instant && all.some(y => y !== x && y.pts.total === x.pts.total);
  }
  return all.sort((a, b) => a.rank - b.rank);
}

    </div>
    <section class="history" id="sw-summary">${renderTallySummary()}</section>
    ${renderFooter()}
  `;
}

function renderTallySummary() {
  const s = current();
  const ranked = tallyRanks();
  const list = ranked.map(x => `
    <li class="${x.rank === 1 ? "first" : ""}">
      <span class="pos">${rankLabel(x.rank)}</span>
      <span class="dot" style="background:${color(x.p.color)}"></span>
      <span class="nm">${esc(x.p.name)}${x.instant ? `<small>Victoire immédiate</small>` : x.byTie ? `<small>Égalité départagée aux ${G().tie.label} (${x.pts.tie})</small>` : ""}</span>
      <span class="pts">${x.pts.total}</span>
    </li>`).join("");
  const instant = G().instant ? `
    <div class="name-line">
      <span class="hint">Victoire immédiate (suprématie militaire, scientifique${T().ext.agora ? " ou politique" : ""}) :</span>
      <span class="mods">${s.players.map(p => {
        const on = s.instant === p.id;
        return `<button class="mod ${on ? "on" : ""}" style="--c:var(--gold)" data-instant="${p.id}" aria-pressed="${on}"><b>★</b>${esc(p.name)}</button>`;
      }).join("")}</span>
    </div>` : "";
  const all = Object.fromEntries(s.players.map(p => [p.id, tallyPoints(p.id)]));
  const head = s.players.map(p => `<th><span style="background:${color(p.color)}"></span>${esc(p.name)}</th>`).join("");
  const rows = activeCats().map(c => `
    <tr><td><span style="background:var(--c-${c.key})"></span>${c.label}</td>
    ${s.players.map(p => { const v = all[p.id][c.key]; return `<td class="${v < 0 ? "neg" : ""}">${v}</td>`; }).join("")}</tr>`).join("");
  const foot = s.players.map(p => `<td>${all[p.id].total}</td>`).join("");
  return `
    <h2>Classement</h2>
    ${instant}
    <ol class="ranking">${list}</ol>
    <div class="table-wrap"><table>
      <thead><tr><th>&nbsp;</th>${head}</tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td>${foot}</tr></tfoot>
    </table></div>`;
}

function updateTallyLive() {
  const s = current();
  const key = T().cat;
  for (const p of s.players) {
    const pts = tallyPoints(p.id);
    const t = app.querySelector(`[data-total="${p.id}"]`);
    if (t) t.textContent = pts.total;
    const sub = app.querySelector(`[data-pts="${p.id}"]`);
    if (sub) sub.textContent = plural(pts[key]);
  }
  const summary = document.getElementById("sw-summary");
  if (summary) summary.innerHTML = renderTallySummary();
}

/* ---------- Parties enregistrées ---------- */

function hasContent() {
  const s = current();
  if (s.example) return false;
  if (!isTally()) return s.rounds.length > 0;
  return !!s.instant || Object.values(s.scores).some(sc => Object.entries(sc).some(([k, v]) => k !== "mods" && v !== "" && v != null));
}

// Photo figée de la partie : noms, lignes du carnet, totaux et rangs
function buildEntry() {
  const s = current();
  const players = s.players.map(p => ({ name: p.name, color: p.color }));
  let rows, totals, ranks, notes;
  if (isTally()) {
    const ranked = tallyRanks();
    const byId = Object.fromEntries(ranked.map(x => [x.p.id, x]));
    rows = activeCats().map(c => ({ label: c.label, color: `var(--c-${c.key})`, values: s.players.map(p => byId[p.id].pts[c.key]) }));
    totals = s.players.map(p => byId[p.id].pts.total);
    ranks = s.players.map(p => byId[p.id].rank);
    notes = s.players.map(p => byId[p.id].instant ? "Victoire immédiate" : "");
    const exts = G().exts.filter(x => T().ext[x.key]).map(x => x.label);
    if (exts.length) notes.extensions = exts.join(", ");
  } else {
    const t = simpleTotals();
    const r = simpleRanks(t);
    rows = s.rounds.map((round, i) => ({ label: `Manche ${i + 1}`, values: s.players.map(p => round[p.id] || 0) }));
    totals = s.players.map(p => t[p.id]);
    ranks = s.players.map(p => r[p.id]);
    notes = s.players.map(() => "");
  }
  return {
    mode: store.mode, date: new Date().toISOString(), players, rows, totals, ranks, notes: [...notes],
    extensions: notes.extensions || "", lowWins: !isTally() && !!s.lowWins,
    gameName: !isTally() ? (s.gameName || "") : "",
  };
}

function archiveCurrent() {
  if (!hasContent()) return false;
  const s = current();
  const entry = buildEntry();
  const i = s.savedId ? store.archive.findIndex(e => e.id === s.savedId) : -1;
  if (i >= 0) {
    entry.id = s.savedId;
    store.archive[i] = entry;
  } else {
    entry.id = "g" + Date.now().toString(36);
    s.savedId = entry.id;
    store.archive.unshift(entry);
  }
  return true;
}

function renderFooter() {
  const saved = current().savedId && store.archive.some(e => e.id === current().savedId);
  return `
    <section class="footer">
      ${!current().example ? `<button class="ghost" data-act="archive">${saved ? "Mettre à jour la partie enregistrée" : "Enregistrer la partie"}</button>` : ""}
      <p class="notice" role="status">${esc(notice)}</p>
      <button class="link" data-act="open-archive">Parties enregistrées (${gameArchive().length})</button>
    </section>`;
}

const formatDate = iso => {
  try { return new Date(iso).toLocaleString("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return iso.slice(0, 10); }
};

// L'historique affiché est celui du jeu choisi dans la liste déroulante
const gameArchive = () => store.archive.filter(e => e.mode === store.mode);

function renderArchive() {
  const list = gameArchive();
  const score = (e, i) => `${esc(e.players[i].name)} <span class="g-pts">${plural(e.totals[i])}</span>`;
  const cards = list.map(e => {
    const order = e.players.map((p, i) => i).sort((a, b) => e.ranks[a] - e.ranks[b]);
    const winners = order.filter(i => e.ranks[i] === 1);
    const rest = order.filter(i => e.ranks[i] !== 1).map(i => score(e, i)).join(" · ");
    const open = openEntry === e.id;
    const detail = open ? `
      <div class="game-detail">
        ${e.extensions ? `<p class="hint">Extensions : ${esc(e.extensions)}</p>` : ""}
        ${e.lowWins ? `<p class="hint">Le plus petit total gagne.</p>` : ""}
        ${e.notes.some(Boolean) ? `<p class="hint">${e.notes.map((n, i) => n ? `${esc(e.players[i].name)} : ${esc(n)}` : "").filter(Boolean).join(" · ")}</p>` : ""}
        <div class="table-wrap"><table>
          <thead><tr><th>&nbsp;</th>${e.players.map(p => `<th><span style="background:${color(p.color)}"></span>${esc(p.name)}</th>`).join("")}</tr></thead>
          <tbody>${e.rows.map(r => `<tr><td>${r.color ? `<span style="background:${r.color}"></span>` : ""}${esc(r.label)}</td>${r.values.map(v => `<td class="${v < 0 ? "neg" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td>${e.totals.map(v => `<td>${v}</td>`).join("")}</tr></tfoot>
        </table></div>
        <button class="danger-link" data-del-entry="${e.id}">${confirmEntryDelete === e.id ? "Confirmer : supprimer cette partie" : "Supprimer cette partie"}</button>
      </div>` : "";
    return `
      <article class="game-card">
        <button class="game-head" data-open="${e.id}" aria-expanded="${open}">
          <span class="g-top">${e.gameName ? `<span class="g-mode">${esc(e.gameName)}</span>` : ""}<span class="g-date">${formatDate(e.date)}</span></span>
          <span class="g-win"><i>★</i> ${winners.map(i => score(e, i)).join(" · ")}${winners.length > 1 ? " (ex æquo)" : ""}</span>
          ${rest ? `<span class="g-rest">${rest}</span>` : ""}
        </button>
        ${detail}
      </article>`;
  }).join("");
  return `
    <section class="archive">
      ${cards || `<p class="empty">Aucune partie de ${esc(MODES[store.mode].label)} enregistrée. En fin de partie, touchez « Enregistrer la partie » : elle apparaîtra ici avec ses scores détaillés.</p>`}
    </section>
    <div class="footer">
      <p class="notice" role="status">${esc(notice)}</p>
      <button class="ghost" data-act="export">Exporter tout l’historique (${store.archive.length})</button>
      <button class="link" data-act="import">Importer un historique</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p class="hint">Les parties sont gardées dans le navigateur de cet appareil. Exportez-les pour les sauvegarder, les passer sur un autre téléphone ou les partager : l’import ajoute les parties sans créer de doublons.</p>
    </div>`;
}

// Fichier JSON de toutes les parties : partagé (Fichiers, AirDrop, messagerie) quand le téléphone le permet, sinon téléchargé
async function exportArchive() {
  if (!store.archive.length) { notice = "Aucune partie à exporter."; return render(); }
  const day = new Date().toISOString().slice(0, 10);
  const name = `feuille-de-score-${day}.json`;
  const json = JSON.stringify({ app: "feuille-de-score", version: 1, exported: new Date().toISOString(), archive: store.archive }, null, 1);
  const file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: "Historique Feuille de score" });
      notice = `${store.archive.length} partie${store.archive.length > 1 ? "s" : ""} exportée${store.archive.length > 1 ? "s" : ""}.`;
      return render();
    }
  } catch (err) {
    if (err.name === "AbortError") return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  notice = `Fichier ${name} téléchargé.`;
  render();
}

// Ajoute les parties du fichier absentes d'ici ; celles déjà présentes (même identifiant) sont ignorées
async function importArchive(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.archive;
    if (!Array.isArray(list)) throw new Error();
    const valid = list.filter(e => e && e.id && MODES[e.mode] && Array.isArray(e.players) && Array.isArray(e.totals) && Array.isArray(e.ranks) && Array.isArray(e.rows));
    const known = new Set(store.archive.map(e => e.id));
    const added = valid.filter(e => !known.has(e.id)).map(e => ({ notes: [], ...e }));
    store.archive = [...store.archive, ...added].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const dup = valid.length - added.length;
    notice = added.length
      ? `${added.length} partie${added.length > 1 ? "s" : ""} importée${added.length > 1 ? "s" : ""}${dup ? ` (${dup} déjà présente${dup > 1 ? "s" : ""})` : ""}.`
      : valid.length ? "Toutes ces parties sont déjà là." : "Aucune partie trouvée dans ce fichier.";
  } catch (err) {
    notice = "Ce fichier n'est pas un historique de Feuille de score.";
  }
  render();
}

/* ---------- Nouvelle partie ---------- */

function renderSetup() {
  const mode = MODES[store.mode];
  const rows = setupDraft.names.map((name, i) => `
    <div class="name-row">
      <span class="dot" style="background:${color(i)}"></span>
      <input id="name-${i}" data-name="${i}" value="${esc(name)}" placeholder="Joueur ${i + 1}" autocomplete="off" enterkeyhint="next" aria-label="Nom du joueur ${i + 1}">
      <button class="remove" data-remove="${i}" ${setupDraft.names.length <= mode.min ? "disabled" : ""} aria-label="Retirer le joueur ${i + 1}">×</button>
    </div>`).join("");
  return `
    <section class="setup">
      ${store.mode === "simple" ? `
      <label class="field" for="game-name">
        <span class="label"><span>Jeu</span><span>facultatif</span></span>
        <input id="game-name" list="game-names" value="${esc(setupDraft.gameName || "")}" placeholder="Skyjo, Uno, Yams…" autocomplete="off" enterkeyhint="next">
      </label>
      <datalist id="game-names">${[...new Set(store.archive.map(e => e.gameName).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr")).map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>` : ""}
      <div class="label"><span>Joueurs</span><span>${setupDraft.names.length} / ${mode.max}</span></div>
      <div class="names">${rows}</div>
      ${setupDraft.names.length < mode.max ? `<button class="ghost" data-act="add-player">+ Ajouter un joueur</button>` : ""}
      ${store.mode === "simple" ? `
      <fieldset class="choice">
        <legend class="label"><span>Gagnant</span></legend>
        <label class="toggle" for="win-high">
          <span>Le plus grand total gagne<small>Uno, Yams, Rami…</small></span>
          <input type="radio" name="win" id="win-high" value="high" ${setupDraft.lowWins ? "" : "checked"}>
        </label>
        <label class="toggle" for="win-low">
          <span>Le plus petit total gagne<small>Skyjo, 6 qui prend…</small></span>
          <input type="radio" name="win" id="win-low" value="low" ${setupDraft.lowWins ? "checked" : ""}>
        </label>
      </fieldset>` : ""}
      <button class="primary" data-act="start">Commencer la partie</button>
    </section>`;
}

function startGame() {
  archiveCurrent(); // la partie qu'on quitte rejoint l'historique
  const stamp = Date.now().toString(36);
  const players = setupDraft.names.map((name, i) => ({
    id: "p" + i + "-" + stamp,
    name: name.trim() || `Joueur ${i + 1}`,
    color: i,
  }));
  if (isTally()) {
    store[store.mode] = { state: { players, scores: {}, instant: null, example: false }, cat: G().cats[0].key, ext: T().ext };
  } else {
    store.simple = { state: { players, rounds: [], lowWins: setupDraft.lowWins, gameName: (setupDraft.gameName || "").trim(), example: false }, draft: {}, editing: null };
  }
  message = ""; confirmDelete = false; adding = null;
  view = "game";
  render();
}

function addMidGame() {
  const s = current();
  if (s.players.length >= MODES[store.mode].max) { adding = null; return render(); }
  const used = new Set(s.players.map(p => p.color % 8));
  let c = 0;
  while (used.has(c) && c < 8) c++;
  s.players.push({
    id: "p" + s.players.length + "-" + Date.now().toString(36),
    name: (adding || "").trim() || `Joueur ${s.players.length + 1}`,
    color: c,
  });
  adding = null;
  render();
}

/* ---------- Événements ---------- */

const app = document.getElementById("app");

app.addEventListener("click", e => {
  const el = e.target.closest("button, tr[data-round]");
  if (!el) return;
  keepAwake();
  if (el.dataset.act !== "archive") notice = "";
  if (el.dataset.open) {
    openEntry = openEntry === el.dataset.open ? null : el.dataset.open;
    confirmEntryDelete = null;
    return render();
  }
  if (el.dataset.delEntry) {
    const id = el.dataset.delEntry;
    if (confirmEntryDelete !== id) { confirmEntryDelete = id; return render(); }
    store.archive = store.archive.filter(e => e.id !== id);
    confirmEntryDelete = null; openEntry = null;
    return render();
  }
  if (el.dataset.sign) {
    const d = store.simple.draft;
    const cur = d[el.dataset.sign] ?? "";
    d[el.dataset.sign] = cur.startsWith("-") ? cur.slice(1) : "-" + cur;
    return render();
  }
  if (el.dataset.swsign) {
    const sc = current().scores[el.dataset.swsign] ||= {};
    const k = el.dataset.k;
    const cur = sc[k] ?? "";
    sc[k] = cur.startsWith("-") ? cur.slice(1) : "-" + cur;
    return render();
  }
  if (el.dataset.mod) {
    const sc = current().scores[el.dataset.p] ||= {};
    sc.mods ||= {};
    sc.mods[el.dataset.mod] = !sc.mods[el.dataset.mod];
    return render();
  }
  if (el.dataset.instant) {
    const s = current();
    s.instant = s.instant === el.dataset.instant ? null : el.dataset.instant;
    return render();
  }
  if (el.dataset.ext) {
    T().ext[el.dataset.ext] = !T().ext[el.dataset.ext];
    return render();
  }
  if (el.dataset.cat) {
    T().cat = el.dataset.cat;
    return render();
  }
  if (el.dataset.remove !== undefined) {
    setupDraft.names.splice(+el.dataset.remove, 1);
    return render();
  }
  if (el.dataset.round !== undefined) {
    const sm = store.simple;
    sm.editing = +el.dataset.round;
    const round = sm.state.rounds[sm.editing];
    sm.draft = {};
    for (const p of sm.state.players) sm.draft[p.id] = String(round[p.id] ?? 0);
    message = "";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  switch (el.dataset.act) {
    case "commit": return commitRound();
    case "cancel-edit": store.simple.editing = null; store.simple.draft = {}; message = ""; return render();
    case "delete-last": {
      const sm = store.simple;
      if (!confirmDelete) {
        confirmDelete = true;
        render();
        setTimeout(() => { if (confirmDelete) { confirmDelete = false; if (view === "game" && store.mode === "simple") render(); } }, 4000);
        return;
      }
      sm.state.rounds.pop();
      confirmDelete = false;
      if (sm.editing !== null && sm.editing >= sm.state.rounds.length) { sm.editing = null; sm.draft = {}; }
      return render();
    }
    case "next-cat": {
      const cats = activeCats();
      const i = cats.findIndex(c => c.key === T().cat);
      if (cats[i + 1]) {
        T().cat = cats[i + 1].key;
        render();
        app.querySelector(".chips")?.scrollIntoView({ block: "start", behavior: "smooth" });
      } else {
        document.getElementById("sw-summary")?.scrollIntoView({ behavior: "smooth" });
      }
      return;
    }
    case "add-mid":
      adding = "";
      render();
      document.getElementById("new-player")?.focus();
      return;
    case "cancel-add": adding = null; return render();
    case "confirm-add": return addMidGame();
    case "setup": {
      const s = current();
      setupDraft = {
        names: s.example ? Array(MODES[store.mode].setup || 2).fill("") : s.players.map(p => p.name),
        // Reprend le choix de la partie en cours, comme les noms ; « Le plus grand total gagne » sinon
        lowWins: store.mode === "simple" && !s.example ? !!s.lowWins : false,
        gameName: store.mode === "simple" && !s.example ? (s.gameName || "") : "",
      };
      view = "setup";
      adding = null;
      render();
      window.scrollTo({ top: 0 });
      return;
    }
    case "back": view = "game"; return render();
    case "archive":
      notice = archiveCurrent() ? "Partie enregistrée." : "Saisissez des scores avant d'enregistrer.";
      return render();
    case "export": return exportArchive();
    case "import": return document.getElementById("import-file")?.click();
    case "open-archive":
      view = "archive";
      openEntry = null; confirmEntryDelete = null;
      render();
      window.scrollTo({ top: 0 });
      return;
    case "add-player":
      setupDraft.names.push("");
      render();
      document.getElementById(`name-${setupDraft.names.length - 1}`)?.focus();
      return;
    case "start": return startGame();
  }
});

app.addEventListener("input", e => {
  const el = e.target;
  if (notice && (el.dataset.pid || el.dataset.sw)) {
    notice = "";
    const n = app.querySelector(".notice");
    if (n) n.textContent = "";
  }
  if (el.dataset.pid) {
    const digits = el.value.replace(/[^\d]/g, "");
    if (digits !== el.value) el.value = digits;
    const d = store.simple.draft;
    const neg = (d[el.dataset.pid] ?? "").startsWith("-") || e.data === "-";
    d[el.dataset.pid] = (neg ? "-" : "") + digits;
    if (message) { message = ""; app.querySelector(".msg").textContent = ""; }
    if (e.data === "-") { const pos = el.selectionStart; render(); const again = document.getElementById(el.id); again?.focus(); again?.setSelectionRange(pos, pos); }
    save();
  } else if (el.dataset.sw) {
    const digits = el.value.replace(/[^\d]/g, "");
    if (digits !== el.value) el.value = digits;
    const sc = current().scores[el.dataset.sw] ||= {};
    const k = el.dataset.k;
    if (G().cats.find(c => c.key === k)?.signed) {
      const neg = (sc[k] ?? "").startsWith("-") || e.data === "-";
      sc[k] = (neg ? "-" : "") + digits;
      const btn = app.querySelector(`[data-swsign="${el.dataset.sw}"]`);
      if (btn) { btn.textContent = neg ? "−" : "+"; btn.classList.toggle("neg", neg); }
    } else {
      sc[k] = digits;
    }
    updateTallyLive();
    save();
  } else if (el.id === "game-name") {
    setupDraft.gameName = el.value;
  } else if (el.id === "new-player") {
    adding = el.value;
  } else if (el.dataset.name !== undefined) {
    setupDraft.names[+el.dataset.name] = el.value;
  }
});

app.addEventListener("change", e => {
  if (e.target.id === "import-file") return importArchive(e.target.files[0]);
  if (e.target.name === "win") setupDraft.lowWins = e.target.value === "low";
  if (e.target.id === "mode") {
    store.mode = e.target.value;
    if (view !== "archive") view = "game";
    adding = null; message = ""; confirmDelete = false; openEntry = null; confirmEntryDelete = null;
    render();
  }
});

// Sélectionne le score existant dès qu'on touche une case, pour le remplacer directement
app.addEventListener("focusin", e => {
  const el = e.target;
  if (!el.matches("input[data-pid], input[data-sw]") || !el.value) return;
  setTimeout(() => { try { el.setSelectionRange(0, el.value.length); } catch (err) { el.select(); } }, 0);
});

app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "new-player") { e.preventDefault(); return addMidGame(); }
  const inputs = [...app.querySelectorAll("#game-name, input[data-pid], input[data-sw], input[data-name]")];
  const i = inputs.indexOf(e.target);
  if (i === -1) return;
  e.preventDefault();
  if (inputs[i + 1]) inputs[i + 1].focus();
  else e.target.blur();
});

// Garde l'écran allumé pendant la partie quand le navigateur le permet
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wakeLock === null) keepAwake(); });

render();
</script>
